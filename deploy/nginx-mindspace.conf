# MINDSPACE — Optimized Production Nginx Configuration
# Includes Gzip/Brotli compression, immutable caching for Next.js assets, and WebSocket support

server {
    listen 80;
    server_name _;

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL is installed)
    # return 301 https://$host$request_uri;

    client_max_body_size 50M;

    # -------------------------------------------------------------
    # High-Performance Compression (Gzip & Brotli)
    # -------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;

    # If ngx_brotli module is enabled in Nginx:
    # brotli on;
    # brotli_comp_level 6;
    # brotli_min_length 256;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # -------------------------------------------------------------
    # Next.js Static Assets: 1-Year Immutable Caching
    # -------------------------------------------------------------
    location /_next/static/ {
        alias /var/www/mindspace/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static media & uploads
    location /public/ {
        alias /var/www/mindspace/public/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Published student project previews
    location /p/ {
        alias /var/www/mindspace/public/p/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ =404;
    }

    # -------------------------------------------------------------
    # Next.js Reverse Proxy & WebSockets (Terminal & Interactive)
    # -------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for interactive terminal sessions & long-running jobs
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
